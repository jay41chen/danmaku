name: Server CI

on:
  push:
    branches: [dev]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # ci/ci 是 CI 專用、跑完即丟的 container 帳密，不是機密
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: danmaku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d danmaku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # CI=true 由 GitHub 自動設，testenv.Require 因此會讓缺環境變數的 integration test fail 而不是 skip
      # -p 1：store 測試共用同一個 DB，不能多個 package 同時跑
      # -count=1：不用測試快取（setup-go 會快取 GOCACHE）。CI 的價值是乾淨的外部狀態，code 沒變的 integration test 也要在全新 DB 上重跑
      - name: Test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/danmaku_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/15
        run: go test -race -p 1 -count=1 ./...

  # 只 build 不 push：目的是 Dockerfile 壞掉時能在 push 時就發現
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./server
