# 定義 named volume（跟 services 同一層），實際名稱會是 danmaku_<key>
# 不用 anonymous volume：docker compose down 後它會跟 container 脫鉤，下次 up 會換成新的空 volume
volumes:
    pgdata:
    grafanadata:
    promdata:
    lokidata:

services:
    postgres:
        image: postgres:17
        container_name: danmaku-db
        ports:
            - 3192:5432 # 5432為image default port，不能改
        environment:
            POSTGRES_USER: danmaku
            POSTGRES_PASSWORD: danmaku
            POSTGRES_DB: danmaku
        volumes:
            - pgdata:/var/lib/postgresql/data
    
    redis: # 刻意不掛 volume：Pub/Sub 和限流計數都不需要保存，重啟後清空沒關係
        image: redis:7
        container_name: danmaku-redis
        ports:
            - 2907:6379 # 6379為image default port，不能改
    server-1: #  key name, 其他 container 用 "server-1" 就能找到它
        build: ./server # dockerfile path
        container_name: danmaku-server-1
        depends_on:
            - postgres
            - redis
        environment:
            # 走內網，所以port用5432
            DATABASE_URL: postgres://danmaku:danmaku@postgres:5432/danmaku
            REDIS_URL: redis://redis:6379
            # nginx 會用 $remote_addr 覆蓋 X-Real-IP（見 config/nginx.conf），限流用它當 client IP
            CLIENT_IP_HEADER: X-Real-IP
        ports:
            - 5388:8080
    server-2:
        build: ./server
        container_name: danmaku-server-2
        depends_on:
            - postgres
            - redis
        environment:
            # 走內網，所以port用5432
            DATABASE_URL: postgres://danmaku:danmaku@postgres:5432/danmaku
            REDIS_URL: redis://redis:6379
            # nginx 會用 $remote_addr 覆蓋 X-Real-IP（見 config/nginx.conf），限流用它當 client IP
            CLIENT_IP_HEADER: X-Real-IP
        ports:
            - 5389:8080
    nginx:
        image: nginx:1.27-alpine
        container_name: danmaku-nginx
        depends_on:
            - server-1
            - server-2
        volumes:
            - ./config/nginx.conf:/etc/nginx/nginx.conf:ro # 把本機的nginx config覆蓋到container內
        ports:
            - 5390:80
    
    loki:
        image: grafana/loki:3.0.0
        container_name: danmaku-loki
        volumes:
            - lokidata:/loki
        ports:
            - 5391:3100
    
    promtail:
        image: grafana/promtail:3.0.0
        container_name: danmaku-promtail
        depends_on:
            - loki
        # promtail比較特別，不需要port，因為他只是relay去loki而已
        volumes:
            - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        group_add: # 提供權限讓promtail可以透過docker socket去問有哪些container
            - "0"
    
    grafana:
        image: grafana/grafana:11.0.0
        container_name: danmaku-grafana
        depends_on:
            - loki
        ports:
            - 5392:3000
        volumes:
            - grafanadata:/var/lib/grafana

    prometheus:
        image: prom/prometheus:v3.15.0
        container_name: danmaku-prometheus
        volumes:
            - ./config/prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - promdata:/prometheus
        group_add:
            - "0"
        ports:
            - 5393:9090

    
