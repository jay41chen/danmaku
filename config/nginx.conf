events{

}

http {
    # Request ID：判斷合不合法只由 server 的 RequestID middleware 負責（唯一真相來源），nginx 不重複寫 regex
    # 1. 轉發：client 有帶就原樣轉送，沒帶才補上 nginx 產生的 $request_id
    map $http_x_request_id $req_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    # 2. 記錄：用 server 回傳的 X-Request-ID（server 驗證過、最後採用的值），所以兩邊 log 一定一致，
    #    也不會把 client 的任意字串寫進 access log。upstream 沒回應（502 / timeout）時 fallback 成 $request_id
    map $upstream_http_x_request_id $log_req_id {
        ""      $request_id;
        default $upstream_http_x_request_id;
    }

    # 預設的 combined 格式 + request_id + 實際轉發到哪台 upstream
    log_format with_request_id '$remote_addr - $remote_user [$time_local] "$request" '
                               '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                               'request_id=$log_req_id upstream=$upstream_addr';
    access_log /var/log/nginx/access.log with_request_id;

    # load balancer，需要和`docker-compose`一致
    upstream backend_service {
        server server-1:8080;
        server server-2:8080;

        least_conn; # 因應long running connection
    }

    server {
        # nginx 自己的port
        listen 80;

        # route request to upstream servers
        location / {
            proxy_pass http://backend_service;

            # 把 request ID 傳給 server（server 會沿用合法的值）
            proxy_set_header X-Request-ID $req_id;

            # 把真正的 client IP 傳給 server（rate limit 用）
            #   $remote_addr 是 TCP 連線對端的 IP，不是從 header 讀的，client 偽造不了
            #   用「覆蓋」：client 自己帶的 X-Real-IP 會被換掉
            #   不用 X-Forwarded-For：$proxy_add_x_forwarded_for 是「附加」，client 填的假值會留在最前面
            #   Railway 的 edge 也會覆蓋 X-Real-IP，所以兩邊 server 都讀同一個 header
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket 需要這三行
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}