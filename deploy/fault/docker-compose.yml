# 故障注入 / 慢 client 實驗環境（ROADMAP M10）：跑完即丟，不跟根目錄的 dev compose 共用任何資源。
# nginx（kill 情境）：跟根目錄 compose 同一份 config/nginx.conf、同一個 image，掛在 server-1 / server-2 前面。
# 用法見 up.sh / stuck.sh / redis.sh / kill.sh / down.sh；一律用 `-p danmaku-fault`，不要在這裡設 container_name（避免跟 dev 的 danmaku-* 撞名）。
name: danmaku-fault

services:
  postgres:
    image: postgres:17
    environment:
      # fault 環境專用、跑完即丟的帳密，跟根目錄 compose 的 danmaku/danmaku 同一類
      POSTGRES_USER: fault
      POSTGRES_PASSWORD: fault
      POSTGRES_DB: danmaku_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fault -d danmaku_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      # 只綁 127.0.0.1：給 Mac 原生對照組用
      - "127.0.0.1:5489:5432"

  redis:
    image: redis:7
    command: ["redis-server", "--save", ""]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5490:6379"

  server-1:
    build: ../../server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # pgxpool 從 URL 讀 pool_max_conns；未設時 server 用 pgx 預設 max(4, CPU 數)，本機 Docker VM 為 8，
      # 所以預設 8 讓行為不變；要實驗其他池大小時用 `PG_POOL_MAX_CONNS=32 sh deploy/fault/up.sh`（M10d 池大小實驗）
      # pool_min_conns 讓 pgxpool 啟動後在背景先把連線開到這個數（預設 0 與 pgx 預設相同）；M10d 用來測「量測開始時大量開新連線」是不是過載的觸發點，例如 `PG_POOL_MAX_CONNS=32 PG_POOL_MIN_CONNS=32 sh deploy/fault/up.sh`
      DATABASE_URL: postgres://fault:fault@postgres:5432/danmaku_test?sslmode=disable&pool_max_conns=${PG_POOL_MAX_CONNS:-8}&pool_min_conns=${PG_POOL_MIN_CONNS:-0}
      REDIS_URL: redis://redis:6379/15
      JWT_SECRET: ${JWT_SECRET:?run up.sh}
      WS_MAX_CLIENTS: "6000"
      LOADTEST_TIMING_LOG: "true"
      # 不設 CLIENT_IP_HEADER：跟 M6 一樣，工具直連 server
    ports:
      - "127.0.0.1:5488:8080"

  server-2:
    build: ../../server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fault:fault@postgres:5432/danmaku_test?sslmode=disable&pool_max_conns=${PG_POOL_MAX_CONNS:-8}&pool_min_conns=${PG_POOL_MIN_CONNS:-0}
      REDIS_URL: redis://redis:6379/15
      JWT_SECRET: ${JWT_SECRET:?run up.sh}
      WS_MAX_CLIENTS: "6000"
      LOADTEST_TIMING_LOG: "true"

  # kill 情境（kill.sh）的入口：負載平衡到 server-1 / server-2。沿用根目錄的 config（不複製），
  # 其中 upstream 的 server-1:8080 / server-2:8080 剛好跟這裡的 service 名稱一致
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - server-1
      - server-2
    volumes:
      - ../../config/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:5491:80"
